# Cloud Build configuration for SolaceSquad deployment
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:latest'
      - './backend'
    
  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:$BUILD_ID'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'solacesquad'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=abiding-idea-485817-k2:us-central1:solacesquad-login-data1'
      - '--update-secrets=SENDGRID_API_KEY=sendgrid-api-key:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,DEBUG=False,DB_USER=Admin,DB_PASSWORD=SoulSquad2024x,DB_NAME=solacesquad_prod,INSTANCE_CONNECTION_NAME=abiding-idea-485817-k2:us-central1:solacesquad-login-data1,BYPASS_OTP_VERIFICATION=false,GCP_PROJECT_ID=abiding-idea-485817-k2,GCP_LOCATION=global,GEMINI_API_KEY=AIzaSyDzlEfQKdWv08Ar-SC4Mw5y9DlxPaZ34HA,ADMIN_EMAIL=admin@solacesquad.com,FROM_EMAIL=sg@solacesquad.com,APP_BASE_URL=https://www.solacesquad.com,GOOGLE_CLIENT_ID=312011725712-b0jklorh936kp9b8qimf017idspnhvcf.apps.googleusercontent.com,TURN_HOST=34.47.239.160,TURN_SECRET=e1b303678fd6159434efec760b6953cc22986e118f1b551a45665439597114469,SARVAM_API_KEY=sk_f9d5krj6_zkw9uIg9o4gUFIcy0yjkCM3B,RAZORPAY_KEY_ID=rzp_live_T2O7j0YoMiRkHq,RAZORPAY_KEY_SECRET=6rVh6vkNXOw70ClZNxsbGfhS,SECRET_KEY=SolaceSquad-Prod-StableKey-2024-mQ8nR3vX6wL2,INTERNAL_CRON_SECRET=cron-secret-123-xyz,MSG91_AUTH_KEY=491737Ax0ZKYvzxRz69807d4bP1,MSG91_TEMPLATE_ID=6a5241e382052452380ead06,MSG91_SENDER_ID=SolSqd'
      - '--memory=1Gi'
      - '--cpu=1'

  # Explicitly move 100% of traffic to the latest revision
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'solacesquad'
      - '--to-latest'
      - '--region=us-central1'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:$BUILD_ID'

# Specify logs bucket to satisfy custom service account requirement
logsBucket: 'gs://abiding-idea-485817-k2-build-logs'

timeout: 1200s
