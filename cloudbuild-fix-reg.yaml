steps:
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install cloud-sql-python-connector==1.13.0 pg8000==1.30.5 sqlalchemy==2.0.25 --quiet 2>&1
        python3 << 'PYEOF'
        import os
        from google.cloud.sql.connector import Connector, IPTypes
        from sqlalchemy import create_engine, text

        connector = Connector()
        def getconn():
            return connector.connect(
                os.environ['INSTANCE_CONNECTION_NAME'], 'pg8000',
                user=os.environ['DB_USER'],
                password=os.environ['DB_PASSWORD'],
                db=os.environ['DB_NAME'],
                ip_type=IPTypes.PUBLIC
            )
        engine = create_engine('postgresql+pg8000://', creator=getconn)

        with engine.connect() as conn:
            # List current published sections
            r = conn.execute(text("SELECT id, title, is_published FROM homepage_sections ORDER BY id"))
            rows = r.fetchall()
            print(f"Total rows in homepage_sections: {len(rows)}")
            for row in rows:
                print(f"  id={row[0]} title={str(row[1])[:40]!r} is_published={row[2]}")

            # Unpublish all to force home.html fallback
            r2 = conn.execute(text("UPDATE homepage_sections SET is_published = FALSE"))
            conn.commit()
            print(f"Unpublished {r2.rowcount} sections. Server will now serve home.html fallback.")

        print('ALL DONE!')
        connector.close()
        PYEOF
    env:
      - 'DB_USER=Admin'
      - 'DB_PASSWORD=SoulSquad2024x'
      - 'DB_NAME=solacesquad_prod'
      - 'INSTANCE_CONNECTION_NAME=abiding-idea-485817-k2:us-central1:solacesquad-login-data1'

timeout: 60s
