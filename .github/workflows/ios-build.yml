name: SolaceSquad iOS Build & Appetize Package

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install CocoaPods
        run: |
          cd ios-wrapper
          pod install

      - name: Build for iOS Simulator (Unsigned - Zero Apple Account Required)
        run: |
          cd ios-wrapper
          xcodebuild build \
            -workspace SolaceSquad.xcworkspace \
            -scheme SolaceSquad \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Artifact (Ready for Appetize.io testing)
        uses: actions/upload-artifact@v4
        with:
          name: SolaceSquad-Simulator-App
          path: ios-wrapper/build/Build/Products/Debug-iphonesimulator/SolaceSquad.app
