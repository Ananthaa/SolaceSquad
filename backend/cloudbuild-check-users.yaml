steps:
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install cloud-sql-python-connector==1.13.0 pg8000==1.30.5 sqlalchemy==2.0.25 --quiet 2>&1
        python3 -c "
        import os
        from google.cloud.sql.connector import Connector, IPTypes
        from sqlalchemy import create_engine, text

        connector = Connector()
        def getconn():
            return connector.connect(os.environ['INSTANCE_CONNECTION_NAME'], 'pg8000', user=os.environ['DB_USER'], password=os.environ['DB_PASSWORD'], db=os.environ['DB_NAME'], ip_type=IPTypes.PUBLIC)
        engine = create_engine('postgresql+pg8000://', creator=getconn)

        # Check what columns exist in vitals_records to confirm migration
        with engine.connect() as conn:
            result = conn.execute(text(\"SELECT column_name FROM information_schema.columns WHERE table_name='vitals_records' ORDER BY column_name\"))
            cols = [r[0] for r in result.fetchall()]
            print('vitals_records columns:')
            for c in cols:
                print(f'  - {c}')

            # Also check workout_logs
            result2 = conn.execute(text(\"SELECT column_name FROM information_schema.columns WHERE table_name='workout_logs' ORDER BY column_name\"))
            cols2 = [r[0] for r in result2.fetchall()]
            print('workout_logs columns:', cols2)

        connector.close()
        "
    env:
      - 'DB_USER=solacesquad_user'
      - 'DB_NAME=solacesquad_prod'
      - 'INSTANCE_CONNECTION_NAME=abiding-idea-485817-k2:us-central1:solacesquad-login-data1'
    secretEnv: ['DB_PASSWORD']

availableSecrets:
  secretManager:
    - versionName: projects/abiding-idea-485817-k2/secrets/db-password/versions/21
      env: 'DB_PASSWORD'

timeout: 60s
