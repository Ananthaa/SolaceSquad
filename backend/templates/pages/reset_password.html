{% extends "base.html" %}

{% block content %}
<div
    class="min-h-screen bg-gradient-to-br from-primary-50 via-secondary-50 to-primary-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <img src="/static/images/logo.png" alt="SolaceSquad" class="h-16 mx-auto mb-4">
            <h1 class="text-3xl font-bold text-gray-800">Reset Password</h1>
            <p class="text-gray-600 mt-2">Enter your new password</p>
        </div>

        <!-- Reset Password Form -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form id="reset-password-form" class="space-y-6">
                <input type="hidden" id="token" value="{{ token }}">

                <!-- New Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        New Password
                    </label>
                    <input type="password" id="password" name="password" required minlength="6"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        placeholder="Enter new password">
                    <p class="text-xs text-gray-500 mt-1">Minimum 6 characters</p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-2">
                        Confirm Password
                    </label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        placeholder="Confirm new password">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full bg-gradient-to-r from-primary-500 to-secondary-500 text-white py-3 rounded-lg font-medium hover:from-primary-600 hover:to-secondary-600 transition-all duration-200 shadow-md">
                    Reset Password
                </button>

                <!-- Message -->
                <div id="message" class="hidden p-4 rounded-lg"></div>
            </form>

            <!-- Back to Login -->
            <div class="mt-6 text-center">
                <a href="/login" class="text-primary-600 hover:text-primary-700 font-medium">
                    ← Back to Login
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const token = document.getElementById('token').value;

        // Validate passwords match
        if (password !== confirmPassword) {
            messageDiv.classList.remove('hidden');
            messageDiv.className = 'p-4 rounded-lg bg-red-50 border border-red-200 text-red-800';
            messageDiv.textContent = 'Passwords do not match!';
            return;
        }

        // Disable button
        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting...';

        try {
            const response = await fetch('/api/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token, password })
            });

            const data = await response.json();

            messageDiv.classList.remove('hidden');

            if (data.success) {
                messageDiv.className = 'p-4 rounded-lg bg-green-50 border border-green-200 text-green-800';
                messageDiv.textContent = data.message || 'Password reset successful! Redirecting to login...';

                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                messageDiv.className = 'p-4 rounded-lg bg-red-50 border border-red-200 text-red-800';
                messageDiv.textContent = data.error || 'Failed to reset password. Please try again.';

                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        } catch (error) {
            messageDiv.classList.remove('hidden');
            messageDiv.className = 'p-4 rounded-lg bg-red-50 border border-red-200 text-red-800';
            messageDiv.textContent = 'An error occurred. Please try again.';

            // Re-enable button
            submitBtn.disabled = false;
            submitBtn.textContent = 'Reset Password';
        }
    });
</script>
{% endblock %}
