{% extends "base.html" %}

{% block content %}
<div
    class="min-h-screen bg-gradient-to-br from-primary-50 via-secondary-50 to-primary-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <img src="/static/images/logo.png" alt="SolaceSquad" class="h-16 mx-auto mb-4">
            <h1 class="text-3xl font-bold text-gray-800">Forgot Password</h1>
            <p class="text-gray-600 mt-2">Enter your email to reset your password</p>
        </div>

        <!-- Forgot Password Form -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form id="forgot-password-form" class="space-y-6">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                    </label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        placeholder="your@email.com">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full bg-gradient-to-r from-primary-500 to-secondary-500 text-white py-3 rounded-lg font-medium hover:from-primary-600 hover:to-secondary-600 transition-all duration-200 shadow-md">
                    Send Reset Link
                </button>

                <!-- Message -->
                <div id="message" class="hidden p-4 rounded-lg"></div>
            </form>

            <!-- Back to Login -->
            <div class="mt-6 text-center">
                <a href="/login" class="text-primary-600 hover:text-primary-700 font-medium">
                    ← Back to Login
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');
        const email = document.getElementById('email').value;

        // Disable button
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';

        try {
            const response = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            messageDiv.classList.remove('hidden');

            if (data.success) {
                messageDiv.className = 'p-4 rounded-lg bg-green-50 border border-green-200 text-green-800';
                messageDiv.innerHTML = (data.message || 'Password reset link sent!') + ' <br><span style="font-size:0.85em;">📬 Check your inbox — if you don\'t see it, look in your <strong>spam or junk folder</strong>.</span>';

                // Clear form
                document.getElementById('email').value = '';

                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = '/login';
                }, 3000);
            } else {
                messageDiv.className = 'p-4 rounded-lg bg-red-50 border border-red-200 text-red-800';
                messageDiv.textContent = data.error || 'Failed to send reset link. Please try again.';

                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        } catch (error) {
            messageDiv.classList.remove('hidden');
            messageDiv.className = 'p-4 rounded-lg bg-red-50 border border-red-200 text-red-800';
            messageDiv.textContent = 'An error occurred. Please try again.';

            // Re-enable button
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Reset Link';
        }
    });
</script>
{% endblock %}
