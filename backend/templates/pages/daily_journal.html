{% extends "layouts/protected.html" %}

{% block dashboard_content %}
<style>
    .journal-header {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 1.5rem;
    }
    .journal-header-title-section {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }
    .journal-header-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: #1f2937;
        margin: 0;
        white-space: nowrap;
    }
    .journal-header-date-section {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        align-items: flex-start;
    }
    .journal-date-input {
        font-size: 1.1rem;
        padding: 0.4rem 0.8rem;
        border-radius: 0.5rem;
        border: 2px solid #fde68a;
        background-color: #fff;
        color: #374151;
        width: 100%;
        max-width: 200px;
    }
    @media (min-width: 640px) {
        .journal-header {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        .journal-header-title {
            font-size: 2.25rem;
        }
        .journal-header-date-section {
            align-items: flex-end;
            text-align: right;
        }
    }
</style>
<div class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-rose-50 py-8 -m-3 sm:-m-4 md:-m-6">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header with Date -->
        <div class="bg-white rounded-t-2xl shadow-lg p-4 sm:p-8 border-b-4 border-amber-200">
            <div class="journal-header">
                <div class="journal-header-title-section">
                    <h1 class="journal-header-title font-serif">My Daily Journal</h1>
                    <p class="text-xs sm:text-sm text-gray-600 italic">A space for your thoughts and feelings</p>
                </div>
                <div class="journal-header-date-section">
                    <input type="date" id="journal-date"
                        class="journal-date-input font-serif focus:ring-2 focus:ring-amber-400 focus:border-transparent">
                    <p class="text-xs sm:text-sm text-gray-500 mt-1" id="day-of-week"></p>
                </div>
            </div>

            <!-- Mood and Vitals Summary -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Mood Card -->
                <div class="bg-gradient-to-br from-purple-100 to-pink-100 rounded-xl p-4 border-2 border-purple-200">
                    <div class="flex items-center gap-3">
                        <div class="bg-white rounded-full p-3">
                            <i data-lucide="smile" class="w-6 h-6 text-purple-600"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-600">Today's Mood</p>
                            <p class="text-xl font-bold text-purple-900" id="mood-display">Not logged</p>
                        </div>
                    </div>
                </div>

                <!-- Health Score Card -->
                <div class="bg-gradient-to-br from-green-100 to-emerald-100 rounded-xl p-4 border-2 border-green-200">
                    <div class="flex items-center gap-3">
                        <div class="bg-white rounded-full p-3">
                            <i data-lucide="heart-pulse" class="w-6 h-6 text-green-600"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-600">Health Score</p>
                            <p class="text-xl font-bold text-green-900" id="health-score">Not scanned</p>
                        </div>
                    </div>
                </div>

                <!-- Latest Vitals Card -->
                <div class="bg-gradient-to-br from-blue-100 to-cyan-100 rounded-xl p-4 border-2 border-blue-200">
                    <div class="flex items-center gap-3">
                        <div class="bg-white rounded-full p-3">
                            <i data-lucide="activity" class="w-6 h-6 text-blue-600"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-600">Heart Rate</p>
                            <p class="text-xl font-bold text-blue-900" id="heart-rate">--</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Journal Entry Area -->
        <div class="bg-white shadow-lg">
            <div class="p-8">
                <!-- Entry Title -->
                <div class="mb-6">
                    <input type="text" id="entry-title" placeholder="Give your entry a title (optional)..."
                        class="w-full text-2xl font-serif text-gray-800 border-b-2 border-gray-200 focus:border-amber-400 outline-none pb-2 placeholder-gray-400">
                </div>

                <!-- Diary Lines -->
                <div class="relative">
                    <textarea id="entry-content" placeholder="Dear Diary,&#10;&#10;Today I feel..."
                        class="w-full h-96 font-serif text-lg text-gray-800 leading-relaxed resize-none outline-none bg-transparent"
                        style="background-image: repeating-linear-gradient(transparent, transparent 2.45rem, #cbd5e1 2.45rem, #cbd5e1 2.5rem); line-height: 2.5rem; padding-top: 0.45rem;"></textarea>
                </div>

                <!-- Word Count -->
                <div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-200">
                    <div class="text-sm text-gray-500">
                        <span id="word-count">0</span> words · <span id="char-count">0</span> characters
                    </div>
                    <div class="text-xs text-gray-400" id="last-saved">
                        Not saved yet
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="bg-white rounded-b-2xl shadow-lg p-6 flex items-center justify-between">
            <button onclick="deleteEntry()" id="delete-btn"
                class="px-6 py-3 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-all duration-200 font-medium hidden">
                <i data-lucide="trash-2" class="w-4 h-4 inline-block mr-2"></i>
                Delete Entry
            </button>

            <div class="flex gap-3 ml-auto">
                <button onclick="clearEntry()"
                    class="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-all duration-200 font-medium">
                    <i data-lucide="x" class="w-4 h-4 inline-block mr-2"></i>
                    Clear
                </button>
                <button onclick="saveEntry()"
                    class="px-8 py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-lg hover:from-amber-600 hover:to-orange-600 transition-all duration-200 font-medium shadow-md">
                    <i data-lucide="save" class="w-4 h-4 inline-block mr-2"></i>
                    Save Entry
                </button>
            </div>
        </div>

        <!-- Previous Entries -->
        <div class="mt-8 bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-2xl font-serif font-bold text-gray-800 mb-4">Previous Entries</h2>
            <div id="entries-list" class="space-y-3">
                <!-- Entries will be loaded here -->
            </div>
        </div>
    </div>
</div>

<script>
    let currentEntryId = null;
    let currentDate = new Date().toISOString().split('T')[0];

    // Initialize
    document.addEventListener('DOMContentLoaded', function () {
        // Set today's date
        document.getElementById('journal-date').value = currentDate;
        updateDayOfWeek();

        // Load data
        loadEntryForDate(currentDate);
        loadPreviousEntries();

        // Event listeners
        document.getElementById('journal-date').addEventListener('change', function (e) {
            currentDate = e.target.value;
            updateDayOfWeek();
            loadEntryForDate(currentDate);
        });

        document.getElementById('entry-content').addEventListener('input', updateWordCount);
        document.getElementById('entry-title').addEventListener('input', updateWordCount);

        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    });

    function updateDayOfWeek() {
        const date = new Date(currentDate);
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('day-of-week').textContent = date.toLocaleDateString('en-US', options);
    }

    function updateWordCount() {
        const content = document.getElementById('entry-content').value;
        const words = content.trim().split(/\s+/).filter(w => w.length > 0).length;
        const chars = content.length;

        document.getElementById('word-count').textContent = words;
        document.getElementById('char-count').textContent = chars;
    }

    async function loadEntryForDate(date) {
        try {
            const response = await fetch(`/api/journal/entry/${date}`);
            const data = await response.json();

            if (data.success) {
                // Load journal entry
                if (data.journal) {
                    currentEntryId = data.journal.id;
                    document.getElementById('entry-title').value = data.journal.title || '';
                    document.getElementById('entry-content').value = data.journal.content || '';
                    document.getElementById('delete-btn').classList.remove('hidden');

                    const savedDate = new Date(data.journal.updated_at);
                    document.getElementById('last-saved').textContent =
                        `Last saved: ${savedDate.toLocaleString()}`;

                    updateWordCount();
                } else {
                    clearEntry();
                }

                // Display mood
                if (data.mood) {
                    const moodEmojis = {
                        '1': '😢 Terrible',
                        '2': '😞 Very Bad',
                        '3': '😔 Bad',
                        '4': '😐 Okay',
                        '5': '🙂 Good',
                        '6': '😊 Great',
                        '7': '😄 Excellent'
                    };
                    document.getElementById('mood-display').textContent =
                        moodEmojis[data.mood.mood_rating] || data.mood.mood_rating;
                } else {
                    document.getElementById('mood-display').textContent = 'Not logged';
                }

                // Display vitals
                if (data.vitals) {
                    if (data.vitals.health_score) {
                        document.getElementById('health-score').textContent =
                            Math.round(data.vitals.health_score) + '/100';
                    }
                    if (data.vitals.heart_rate) {
                        document.getElementById('heart-rate').textContent =
                            data.vitals.heart_rate + ' bpm';
                    }
                } else {
                    document.getElementById('health-score').textContent = 'Not scanned';
                    document.getElementById('heart-rate').textContent = '--';
                }
            }
        } catch (error) {
            console.error('Error loading entry:', error);
            showNotification('Error loading entry', 'error');
        }
    }

    async function saveEntry() {
        const title = document.getElementById('entry-title').value.trim();
        const content = document.getElementById('entry-content').value.trim();

        if (!content) {
            showNotification('Please write something before saving!', 'error');
            return;
        }

        try {
            const response = await fetch('/api/journal/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    entry_id: currentEntryId,
                    entry_date: currentDate,
                    title: title,
                    content: content
                })
            });

            const data = await response.json();

            if (data.success) {
                currentEntryId = data.entry.id;
                document.getElementById('delete-btn').classList.remove('hidden');

                const savedDate = new Date(data.entry.updated_at);
                document.getElementById('last-saved').textContent =
                    `Last saved: ${savedDate.toLocaleString()}`;

                showNotification('Entry saved successfully!', 'success');

                // Redirect to dashboard after 1 second
                setTimeout(() => {
                    window.location.href = '/app';
                }, 1000);
            } else {
                showNotification('Error saving entry: ' + data.error, 'error');
            }
        } catch (error) {
            console.error('Error saving entry:', error);
            showNotification('Error saving entry', 'error');
        }
    }

    async function deleteEntry() {
        if (!currentEntryId) return;

        if (!confirm('Are you sure you want to delete this entry? This cannot be undone.')) {
            return;
        }

        try {
            const response = await fetch(`/api/journal/entry/${currentEntryId}`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (data.success) {
                showNotification('Entry deleted successfully', 'success');
                clearEntry();
                loadPreviousEntries();
            } else {
                showNotification('Error deleting entry: ' + data.error, 'error');
            }
        } catch (error) {
            console.error('Error deleting entry:', error);
            showNotification('Error deleting entry', 'error');
        }
    }

    function clearEntry() {
        currentEntryId = null;
        document.getElementById('entry-title').value = '';
        document.getElementById('entry-content').value = '';
        document.getElementById('delete-btn').classList.add('hidden');
        document.getElementById('last-saved').textContent = 'Not saved yet';
        updateWordCount();
    }

    async function loadPreviousEntries() {
        try {
            const response = await fetch('/api/journal/entries');
            const data = await response.json();

            if (data.success) {
                displayEntriesList(data.entries);
            }
        } catch (error) {
            console.error('Error loading entries:', error);
        }
    }

    function displayEntriesList(entries) {
        const list = document.getElementById('entries-list');

        if (entries.length === 0) {
            list.innerHTML = '<p class="text-gray-500 text-center py-8 italic">No entries yet. Start writing your first journal entry!</p>';
            return;
        }

        list.innerHTML = entries.slice(0, 10).map(entry => {
            const date = new Date(entry.entry_date);
            const dateStr = date.toLocaleDateString('en-US', {
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
            const preview = entry.content.substring(0, 100) + (entry.content.length > 100 ? '...' : '');

            return `
            <div class="p-4 border-l-4 border-amber-400 bg-gradient-to-r from-amber-50 to-transparent hover:from-amber-100 rounded-r-lg cursor-pointer transition-all duration-200" 
                 onclick="loadEntry('${entry.entry_date.split('T')[0]}')">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="font-serif font-semibold text-gray-800">${entry.title || 'Untitled Entry'}</h3>
                    <span class="text-sm text-gray-500">${dateStr}</span>
                </div>
                <p class="text-gray-600 text-sm line-clamp-2">${preview}</p>
            </div>
        `;
        }).join('');
    }

    function loadEntry(date) {
        currentDate = date;
        document.getElementById('journal-date').value = date;
        updateDayOfWeek();
        loadEntryForDate(date);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showNotification(message, type) {
        const notification = document.createElement('div');
        notification.className = `fixed top-4 right-4 px-6 py-4 rounded-lg shadow-lg z-50 transform transition-all duration-300 ${type === 'success'
            ? 'bg-green-500 text-white'
            : 'bg-red-500 text-white'
            }`;
        notification.innerHTML = `
        <div class="flex items-center gap-2">
            <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i>
            <span>${message}</span>
        </div>
    `;
        document.body.appendChild(notification);

        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        setTimeout(() => {
            notification.style.opacity = '0';
            setTimeout(() => notification.remove(), 300);
        }, 3000);
    }
</script>
{% endblock %}
