steps:
  # Build fresh image for production
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--no-cache', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:prod-$BUILD_ID', '.']

  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:prod-$BUILD_ID']

  # Deploy to production Cloud Run service
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'solacesquad'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:prod-$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=abiding-idea-485817-k2:us-central1:solacesquad-login-data1'
      - '--update-secrets=SENDGRID_API_KEY=sendgrid-api-key:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,GEMINI_API_KEY=gemini-api-key:latest'
      - '--set-env-vars=DB_USER=Admin,DB_PASSWORD=SoulSquad2024x,DB_NAME=solacesquad_prod,INSTANCE_CONNECTION_NAME=abiding-idea-485817-k2:us-central1:solacesquad-login-data1,BYPASS_OTP_VERIFICATION=false,GCP_PROJECT_ID=abiding-idea-485817-k2,GCP_LOCATION=global,ADMIN_EMAIL=admin@solacesquad.com,FROM_EMAIL=sg@solacesquad.com,RAZORPAY_KEY_ID=rzp_live_T2O7j0YoMiRkHq,RAZORPAY_KEY_SECRET=6rVh6vkNXOw70ClZNxsbGfhS,SECRET_KEY=SolaceSquad-Prod-StableKey-2024-mQ8nR3vX6wL2,GOOGLE_CLIENT_ID=312011725712-b0jklorh936kp9b8qimf017idspnhvcf.apps.googleusercontent.com,APP_BASE_URL=https://www.solacesquad.com,SARVAM_API_KEY=sk_f9d5krj6_zkw9uIg9o4gUFIcy0yjkCM3B,TURN_HOST=34.47.239.160,TURN_SECRET=e1b303678fd6159434efec760b6953cc22986e118f1b551a45665439597114469,INTERNAL_CRON_SECRET=cron-secret-123-xyz,MSG91_AUTH_KEY=491737Ax0ZKYvzxRz69807d4bP1,MSG91_TEMPLATE_ID=6a5241e382052452380ead06,MSG91_SENDER_ID=SolSqd'
      - '--memory=1Gi'
      - '--cpu=1'

  # Route 100% traffic to latest revision
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'solacesquad'
      - '--to-latest'
      - '--region=us-central1'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:prod-$BUILD_ID'

timeout: 1800s
