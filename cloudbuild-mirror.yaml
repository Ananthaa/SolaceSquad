# ─────────────────────────────────────────────────────────────────────────────
# Cloud Build — Mirror (Staging) Deploy
# Usage: gcloud builds submit --config cloudbuild-mirror.yaml --project abiding-idea-485817-k2
# ─────────────────────────────────────────────────────────────────────────────
steps:
  # Build the container image (tagged mirror)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:mirror-$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:mirror-latest'
      - './backend'

  # Push the mirror image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:mirror-$BUILD_ID'

  # Deploy to Cloud Run Mirror service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'solacesquad-mirror'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:mirror-$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=abiding-idea-485817-k2:us-central1:solacesquad-login-data1'
      - '--update-secrets=SENDGRID_API_KEY=sendgrid-api-key:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,GOOGLE_CLIENT_ID=google-client-id:latest,RAZORPAY_KEY_ID=razorpay-key-id-mirror:latest,RAZORPAY_KEY_SECRET=razorpay-key-secret-mirror:latest,SECRET_KEY=secret-key-mirror:latest,SARVAM_API_KEY=sarvam-api-key:latest,MSG91_AUTH_KEY=msg91-auth-key:latest,TURN_SECRET=turn-secret:latest,DB_PASSWORD=db-password:latest'
      - '--set-env-vars'
      - 'ENVIRONMENT=mirror,DEBUG=True,DB_USER=Admin,DB_NAME=solacesquad_mirror,INSTANCE_CONNECTION_NAME=abiding-idea-485817-k2:us-central1:solacesquad-login-data1,BYPASS_OTP_VERIFICATION=false,GCP_PROJECT_ID=abiding-idea-485817-k2,GCP_LOCATION=global,ADMIN_EMAIL=admin@solacesquad.com,FROM_EMAIL=sg@solacesquad.com,APP_BASE_URL=https://solacesquad-mirror-312011725712.us-central1.run.app,TURN_HOST=34.47.239.160,INTERNAL_CRON_SECRET=cron-secret-123-xyz,MSG91_TEMPLATE_ID=6a5241e382052452380ead06,MSG91_SENDER_ID=SolSqd'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--session-affinity'

  # Move 100% of traffic to the latest mirror revision
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'solacesquad-mirror'
      - '--to-latest'
      - '--region=us-central1'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:mirror-$BUILD_ID'

logsBucket: 'gs://abiding-idea-485817-k2-build-logs'
timeout: 1200s
