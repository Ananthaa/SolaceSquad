steps:
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install cloud-sql-python-connector==1.13.0 pg8000==1.30.5 sqlalchemy==2.0.25 --quiet 2>&1
        python3 << 'PYEOF'
        import os
        from google.cloud.sql.connector import Connector, IPTypes
        from sqlalchemy import create_engine, text

        connector = Connector()
        def getconn():
            return connector.connect(
                os.environ['INSTANCE_CONNECTION_NAME'], 'pg8000',
                user=os.environ['DB_USER'],
                password=os.environ['DB_PASSWORD'],
                db=os.environ['DB_NAME'],
                ip_type=IPTypes.PUBLIC
            )
        engine = create_engine('postgresql+pg8000://', creator=getconn)

        with engine.connect() as conn:
            print("Running: demo_videos table creation")
            conn.execute(text("""
                CREATE TABLE IF NOT EXISTS demo_videos (
                    id SERIAL PRIMARY KEY,
                    title VARCHAR(255) NOT NULL,
                    description TEXT,
                    video_url VARCHAR(500) NOT NULL,
                    is_youtube BOOLEAN NOT NULL DEFAULT FALSE,
                    share_with VARCHAR(20) NOT NULL DEFAULT 'both',
                    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                )
            """))
            conn.commit()
            print("Success: demo_videos table creation")

            # Verify
            r = conn.execute(text("SELECT COUNT(*) FROM demo_videos"))
            count = r.scalar()
            print(f"demo_videos table exists with {count} row(s).")

        print('Migration complete!')
        connector.close()
        PYEOF
    availableSecrets:
      secretManager:
        - versionName: projects/$PROJECT_ID/secrets/db-password-admin/versions/latest
          env: 'DB_PASSWORD'
    env:
      - 'DB_USER=Admin'
      - 'DB_NAME=solacesquad_prod'
      - 'INSTANCE_CONNECTION_NAME=abiding-idea-485817-k2:us-central1:solacesquad-login-data1'

timeout: 120s
