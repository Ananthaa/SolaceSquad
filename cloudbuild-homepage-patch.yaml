steps:
  # Build image from existing production base + only home.html patched in
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-f'
      - 'Dockerfile.homepage-patch'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:homepage-patch-$BUILD_ID'
      - 'backend'

  # Push the patched image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:homepage-patch-$BUILD_ID'

  # Deploy ONLY this image to production — all env vars preserved from previous revision
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'solacesquad'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:homepage-patch-$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=abiding-idea-485817-k2:us-central1:solacesquad-login-data1'
      - '--update-secrets=SENDGRID_API_KEY=sendgrid-api-key:latest'
      - '--set-env-vars=DB_USER=Admin,DB_PASSWORD=SoulSquad2024x,DB_NAME=solacesquad_prod,INSTANCE_CONNECTION_NAME=abiding-idea-485817-k2:us-central1:solacesquad-login-data1,BYPASS_OTP_VERIFICATION=false,GCP_PROJECT_ID=abiding-idea-485817-k2,GCP_LOCATION=global,GEMINI_API_KEY=AIzaSyDzlEfQKdWv08Ar-SC4Mw5y9DlxPaZ34HA,ADMIN_EMAIL=admin@solacesquad.com,FROM_EMAIL=sg@solacesquad.com,RAZORPAY_KEY_ID=rzp_test_SdJhucAUTbllnb,RAZORPAY_KEY_SECRET=nPobfRqsHHM0T3FTLZ3D4p4v,SECRET_KEY=SolaceSquad-Prod-StableKey-2024-mQ8nR3vX6wL2,TURN_HOST=34.47.239.160,TURN_SECRET=e1b303678fd6159434efec760b6953cc22986e118f1b551a45665439597114469'
      - '--memory=1Gi'
      - '--cpu=1'

  # Route 100% traffic to the new revision
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'solacesquad'
      - '--to-latest'
      - '--region=us-central1'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/server:homepage-patch-$BUILD_ID'

timeout: 900s
