steps:
  # Build patch image — only gemini_chat.py + simple_bot.py on top of production base
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--no-cache', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/app:emora-patch-v3', '.']

  # Push patch image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/app:emora-patch-v3']

  # Deploy ONLY the image to production — all env vars, secrets, SQL, memory
  # are inherited from the existing Cloud Run service config. Nothing else changes.
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'solacesquad'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/app:emora-patch-v3'
      - '--region=us-central1'
      - '--platform=managed'

  # Route 100% traffic to this new revision
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'solacesquad'
      - '--to-latest'
      - '--region=us-central1'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/solacesquad/app:emora-patch-v1'

timeout: 600s
